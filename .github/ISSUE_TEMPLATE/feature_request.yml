name: Feature request
description: Suggest something that would make your job search easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do?
      description: Describe the situation, for example "I applied to the same company twice without noticing".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea for how Shortlist could handle it. Rough is fine.
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Another app, a spreadsheet, nothing yet?
